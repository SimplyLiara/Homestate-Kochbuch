<title>Kochübersicht Homestate</title>
<style>
:root{
  --bg:#F4ECDC;--ink:#2E2740;--muted:#6B6280;--card:#FBF6EA;--line:#DCCFB4;--accent:#B79CE0;--ui:#8E6FC4;--ui-ink:#FFFFFF;--hero:#8E6FC4;--hero-ink:#FFFFFF;--danger:#A8201A;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{--bg:#1D1A28;--ink:#EDE8F5;--muted:#A9A2BD;--card:#272336;--line:#3B3550;--accent:#9B80D0;--ui:#B79CE0;--ui-ink:#1B1230;--hero:#3A2F58;--hero-ink:#F1EBFA;--danger:#FF8A80;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);-webkit-text-size-adjust:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",system-ui,sans-serif;font-weight:700;letter-spacing:-.022em;line-height:1.1;margin:0}
h2{font-size:clamp(1.9rem,6vw,2.5rem);margin:30px 0 14px}
p{margin:.6em 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}

.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;column-gap:14px;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{width:28px;height:28px;display:block;flex:none}
.brand strong{font-size:1.02rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:2px;margin-right:-10px}
.who{color:var(--muted);font-size:.8rem;margin-right:4px;display:none}
@media(max-width:719px){.brand{flex:1;gap:8px}.brand strong{font-size:.92rem}.acts button.link{padding:6px 5px;font-size:.82rem}.acts{margin-right:-5px}}
@media(min-width:720px){.who{display:inline}}
.tabs{display:flex;gap:2px;order:3;width:calc(100% + 20px);margin:0 -10px;padding-bottom:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
@media(min-width:720px){.tabs{order:0;width:auto;margin:0 auto 0 0;padding:0}.brand{margin-right:18px}}
.tabs button,button.link{background:none;border:0;min-height:36px;padding:6px 10px;font-size:.86rem;border-radius:8px;color:var(--ink);opacity:.68;white-space:nowrap}
.tabs button:hover,button.link:hover{opacity:1}
.tabs button[aria-pressed="true"]{opacity:1;font-weight:600;color:var(--ink);background:none}

button{font:inherit;font-size:.94rem;letter-spacing:inherit;cursor:pointer;border-radius:980px;border:1px solid var(--accent);background:transparent;color:var(--ink);padding:8px 18px;min-height:40px;transition:background-color .2s,opacity .2s,transform .1s}
button:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default}
.primary,.primary:hover{background:var(--ui);border-color:var(--ui);color:var(--ui-ink);font-weight:600}
.primary:hover{opacity:.88}
.danger{color:var(--danger)}
button.danger{border-color:transparent;padding-left:12px;padding-right:12px}
button.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}

.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:11px;padding:3px;gap:2px;margin:24px 0 0;vertical-align:top}
.seg button{border:0;border-radius:8px;min-height:32px;padding:5px 14px;font-size:.86rem;white-space:nowrap;background:transparent}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.16)}
.seg+h2{margin-top:22px}


.card{background:var(--card);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 55%,transparent)}
.card h3{font-size:1.25rem;font-weight:600;margin-bottom:6px}
.card>:last-child{margin-bottom:0}
.warn{background:color-mix(in srgb,var(--danger) 8%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 35%,transparent)}
.muted{color:var(--muted)}
.msg{margin-top:12px;color:var(--danger)}

label{display:block;margin:16px 0 6px;font-weight:600;font-size:.82rem;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;letter-spacing:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ui);box-shadow:0 0 0 4px color-mix(in srgb,var(--ui) 24%,transparent)}
input[readonly]{background:transparent}
select{min-width:0;max-width:100%}
.srow .row{flex-wrap:nowrap;flex:none}
input[type=search]{margin:14px 0 4px;background:color-mix(in srgb,var(--ink) 6%,transparent);border-color:transparent}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;margin:0;accent-color:var(--ui);flex:none}
.chk{display:flex;align-items:center;gap:10px;font-weight:400;font-size:1rem;color:var(--ink);margin:0}
.qty{width:92px;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.grid2{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
@media(max-width:620px){.grid2{grid-template-columns:1fr 1fr}.grid2 .x{grid-column:span 2}}

table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.76rem;font-weight:600;color:var(--muted)}
td,th{text-align:left;padding:10px 5px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{padding-left:0}
td:nth-child(2){hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
tr.done td{color:var(--muted);text-decoration:line-through}
.scroll{overflow-x:auto}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.srow:last-child{border-bottom:0}
ul.ing{margin:8px 0 0;padding-left:1.2em}
ul.ing li::marker{color:var(--accent)}
ol.steps{margin:6px 0 0;padding-left:1.3em}
ol.steps li{margin:6px 0}
.epline{margin:0}

.login{max-width:400px;margin:9vh auto 40px}
.login img{width:84px;height:84px;display:block;margin:0 auto 20px}
.login h2{text-align:center;margin-top:0}
.login input{background:var(--card)}
.login .row{margin-top:22px}
.login .row button{flex:1;min-height:48px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:color-mix(in srgb,var(--ink) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--bg);padding:11px 20px;border-radius:22px;font-size:.92rem;max-width:calc(100% - 32px);width:max-content;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.toast.bad{background:var(--danger)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.top .wrap,.wide{max-width:1120px}
textarea{resize:vertical;min-height:110px;line-height:1.45}
.small{font-size:.85rem}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:34px 24px 26px;margin:22px 0 14px}
.hero .eyebrow{font-size:.9rem;opacity:.8;margin:0 0 6px}
.hero h1{font-size:2.2rem}
.hero .sub{margin:8px 0 0;opacity:.86;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.stat{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.35rem;letter-spacing:-.02em}
.stat span{font-size:.75rem;opacity:.85}
.sbox{margin:14px 0}
.sbox input[type=search]{margin:0;min-height:50px;background:var(--card);border-color:transparent;box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 55%,transparent)}
.sbox input[type=search]:focus{border-color:var(--ui);box-shadow:0 0 0 4px color-mix(in srgb,var(--ui) 24%,transparent)}
.sres:not(:empty){background:var(--card);border-radius:14px;margin-top:6px;padding:2px 16px;box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 55%,transparent)}
.sres p{margin:10px 0}
button.sitem{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:0;padding:11px 0;min-height:0;background:none;text-align:left;font-size:.95rem}
button.sitem:last-child{border-bottom:0}
button.sitem:hover{background:none;opacity:.75}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
button.tile{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:16px;min-height:0;box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 55%,transparent)}
button.tile:hover{background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.tile .ic{display:block;font-size:1.5rem;line-height:1}
.tile b{display:block;margin-top:10px;font-size:1.02rem}
.tile .ts{font-size:.82rem;color:var(--muted)}
.big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big b{font-size:1.9rem;letter-spacing:-.03em;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:.78rem;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;margin:14px 0 2px}
.bar i{display:block;height:100%;background:var(--ui);border-radius:99px}
.ep{padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.ep:last-child{border:0}
.ep .t{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.ep small{color:var(--muted)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:.95rem}
.li:last-of-type{border-bottom:0}
.pill{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.low{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.okp{background:color-mix(in srgb,var(--ui) 16%,transparent);color:var(--ui)}
.note{background:color-mix(in srgb,var(--accent) 18%,var(--card))}
.note small{color:var(--muted)}
.ntext{white-space:pre-wrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex:none}
.bd{display:flex;gap:12px;align-items:center;padding:8px 0}
.dish{display:flex;gap:12px;align-items:center}
.dish .em{width:54px;height:54px;border-radius:14px;background:color-mix(in srgb,var(--accent) 25%,transparent);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none}
@media(min-width:900px){
  .sgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 22px;align-items:start}
  .c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}
  .hero{padding:44px 40px 34px}.hero h1{font-size:3rem}
  .stats{grid-template-columns:repeat(3,minmax(0,170px))}
  .sbox{margin-top:22px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var REPO="SimplyLiara/Homestate-Kochbuch",FILE="data.json";
  var PESO=20,API="https://api.github.com/repos/"+REPO+"/contents/"+FILE,ITER=600000,MINPW=10;
  var S=null,F=null,DKraw=null,DKkey=null,KEKraw=null,TOK="",SHA=null,saving=false;
  var SHOPS=["Bauernhof","24/7","General Store 1","General Store 2","General Store 3","General Store 4","General Store 5","Rex Diner"];
  var STATIONS={herd:"Herd",mixer:"Mixer",grill:"Grill"};
  var me=null,view="start",adminTab="users",msg="",editUser=null,editDish=null,ingEdit=null,recipeTab="herd",listTab="liste";

  function el(tag,props,kids){var n=document.createElement(tag);
    for(var k in (props||{})){if(k==="text")n.textContent=props[k];else n[k]=props[k];}
    (kids||[]).forEach(function(c){n.appendChild(typeof c==="string"?document.createTextNode(c):c)});return n;}
  function btn(t,fn,cls){var b=el("button",{text:t,type:"button",className:cls||""});b.onclick=fn;return b;}
  function field(lbl,input){return el("div",{},[el("label",{text:lbl}),input]);}
  function num(v){v=parseFloat(String(v).replace(",","."));return isFinite(v)&&v>=0?v:0;}
  function money(usd,mxn){if(!(mxn>0))return "$"+usd.toFixed(2);if(!(usd>0))return mxn.toFixed(2)+" ₽";return "$"+usd.toFixed(2)+" / "+mxn.toFixed(2)+" ₽";}
  function kg(v){return String(Math.round(v*1000)/1000).replace(".",",")+" kg";}
  function dateDe(s){var p=(s||"").split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:(s||"–");}
  var ICON=document.querySelector("link[rel=icon]").href;
  function icon(){return el("img",{src:ICON,alt:""});}
  var enc=new TextEncoder(),dec=new TextDecoder();
  function b64(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
  function unb64(s){s=atob(String(s).replace(/\s/g,""));var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  function rnd(n){return crypto.getRandomValues(new Uint8Array(n));}
  async function kekBits(pw,salt){
    var k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},k,256));
  }
  function aes(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);}
  async function seal(key,bytes){
    var iv=rnd(12),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,bytes));
    var o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o);
  }
  async function unseal(key,s){var a=unb64(s);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(0,12)},key,a.slice(12)));}

  function counts(){try{return JSON.parse(localStorage.getItem("rp_c_"+me.name)||"{}")}catch(e){return {}}}
  function setCount(id,v){var c=counts();c[id]=v;try{localStorage.setItem("rp_c_"+me.name,JSON.stringify(c))}catch(e){}}

  function checks(){try{return JSON.parse(localStorage.getItem("rp_k_"+me.name)||"{}")}catch(e){return {}}}
  function setCheck(k,v){var c=checks();if(v)c[k]=1;else delete c[k];try{localStorage.setItem("rp_k_"+me.name,JSON.stringify(c))}catch(e){}}
  function clearChecks(){try{localStorage.removeItem("rp_k_"+me.name)}catch(e){}}
  function resetCounts(){
    if(!confirm("Alle Anzahlen auf 0 setzen?"))return;
    try{localStorage.removeItem("rp_c_"+me.name)}catch(e){}
    clearChecks();render();
  }
  function packOf(m){var p=m&&m.pack;return p&&p.name&&p.size>1?p:null;}
  function singlePrice(m){return (m.usd||0)>0||(m.mxn||0)>0;}
  function packPrice(m){var p=packOf(m);return !!p&&((p.usd||0)>0||(p.mxn||0)>0);}
  function hasPrice(m){var p=packOf(m);return p&&p.only?packPrice(m):singlePrice(m);}
  function priceText(m){
    var p=packOf(m),t=[];
    if(!(p&&p.only))t.push(singlePrice(m)?money(m.usd||0,m.mxn||0)+" pro Stück":"Preis fehlt");
    if(p)t.push(p.name+" ("+fmt(p.size)+" Stück): "+(packPrice(m)?money(p.usd||0,p.mxn||0):"Preis fehlt")+(p.shop&&p.shop!==(m.shop||"")?" bei "+p.shop:"")+(p.only?" – nur so erhältlich":""));
    return t.join(" · ");
  }
  function buyPlan(m,n){
    var p=packOf(m),sp=singlePrice(m),pp=packPrice(m);
    function mk(packs,singles){
      return {packs:packs,singles:singles,units:(p?packs*p.size:0)+singles,
        usd:(p?packs*(p.usd||0):0)+singles*(m.usd||0),mxn:(p?packs*(p.mxn||0):0)+singles*(m.mxn||0),
        priced:(!packs||pp)&&(!singles||sp)};
    }
    if(!p)return mk(0,n);
    var up=Math.ceil(n/p.size);
    if(p.only)return mk(up,0);
    var dn=Math.floor(n/p.size),best=mk(dn,Math.round((n-dn*p.size)*1000)/1000);
    if(sp&&pp){
      var f=((m.usd||0)>0&&(p.usd||0)>0)?"usd":"mxn";
      [mk(up,0),mk(0,n)].forEach(function(o){if(o[f]<best[f]-1e-9)best=o;});
    }
    return best;
  }
  function fmt(v){return String(Math.round(v*100)/100).replace(".",",");}
  function byName(a,b){return a.name.localeCompare(b.name,"de")}
  var useStock=true,backTo=null;

  var toastEl=null,toastT=0;
  function toast(t,bad){
    if(!toastEl){toastEl=el("div",{});toastEl.setAttribute("role","status");document.body.appendChild(toastEl);}
    toastEl.className="toast"+(bad?" bad":"");toastEl.textContent=t;toastEl.hidden=false;
    clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true;},bad?9000:3500);
  }
  function auth(){var h={Accept:"application/vnd.github+json"};if(TOK)h.Authorization="Bearer "+TOK;return h;}
  async function fetchFile(){
    var txt=null;SHA=null;
    try{
      var r=await fetch(API+"?t="+Date.now(),{headers:auth(),cache:"no-store"});
      if(r.ok){var j=await r.json();txt=dec.decode(unb64(j.content));SHA=j.sha;}
    }catch(e){}
    if(txt===null){
      var r2=await fetch(FILE+"?t="+Date.now(),{cache:"no-store"});
      if(!r2.ok)throw new Error("load");
      txt=await r2.text();
    }
    var f=JSON.parse(txt);if(!f||!f.users||!f.data)throw new Error("format");
    F=f;
  }
  async function openState(raw){
    var k=await aes(raw);
    var st=JSON.parse(dec.decode(await unseal(k,F.data)));
    if(!st.stockDishes)st.stockDishes=[];if(!st.ingredients)st.ingredients=[];if(!st.dishes)st.dishes=[];
    DKraw=raw;DKkey=k;S=st;
  }
  function findMe(name){var k=String(name).toLowerCase();return S.users.find(function(u){return u.name.toLowerCase()===k})||null;}
  function fileUser(name){var k=String(name).toLowerCase();return F.users.find(function(x){return x.name.toLowerCase()===k})||null;}
  function replaceRec(rec){var k=rec.name.toLowerCase();return F.users.filter(function(x){return x.name.toLowerCase()!==k}).concat([rec]);}
  async function makeRec(name,pw,withTok){
    var salt=rnd(16),kb=await kekBits(pw,salt),k=await aes(kb);
    var rec={name:name,salt:b64(salt),wrap:await seal(k,DKraw)};
    if(withTok&&TOK)rec.tok=await seal(k,enc.encode(TOK));
    return {rec:rec,kb:kb};
  }
  function keepSession(){try{sessionStorage.setItem("rp_sess",JSON.stringify({name:me.name,dk:b64(DKraw),kek:b64(KEKraw),tok:TOK}))}catch(e){}}
  function logout(){
    me=null;S=null;DKraw=null;DKkey=null;KEKraw=null;TOK="";
    try{sessionStorage.removeItem("rp_sess")}catch(e){}
    view="start";msg="";render();
  }
  async function put(text){
    if(!SHA){
      var g=await fetch(API+"?t="+Date.now(),{headers:auth(),cache:"no-store"});
      if(g.ok)SHA=(await g.json()).sha;else if(g.status!==404)throw g.status;
    }
    var body={message:"Daten aktualisiert",content:b64(enc.encode(text))};if(SHA)body.sha=SHA;
    var h=auth();h["Content-Type"]="application/json";
    var r=await fetch(API,{method:"PUT",headers:h,body:JSON.stringify(body)});
    if(!r.ok)throw r.status;
    SHA=(await r.json()).content.sha;
  }
  async function save(st,fus){
    if(saving)return false;
    saving=true;
    try{
      Object.keys(S).forEach(function(k){if(!(k in st))st[k]=S[k];});
      st.users=st.users||S.users;st.dishes=st.dishes||S.dishes;st.ingredients=st.ingredients||S.ingredients;st.stockDishes=st.stockDishes||S.stockDishes;
      var nf={v:1,users:fus||F.users,data:await seal(DKkey,enc.encode(JSON.stringify(st)))};
      var text=JSON.stringify(nf);
      msg="";
      if(TOK){
        toast("Speichere …");
        try{await put(text);}
        catch(e){
          if(e===409||e===422){
            try{await fetchFile();await openState(DKraw);me=findMe(me.name)||me;}catch(x){}
            toast("Die Daten wurden inzwischen geändert. Der neue Stand ist geladen – bitte wiederhole deine Änderung.",true);
            render();return false;
          }
          toast(e===401?"Der GitHub-Schlüssel ist ungültig oder abgelaufen. Trage unter Admin → Einstellungen einen neuen ein.":
            (e===403||e===404)?"Der GitHub-Schlüssel hat keine Schreibrechte für das Repo.":"Speichern hat nicht geklappt. Bitte versuche es noch einmal.",true);
          return false;
        }
        toast("Gespeichert.");
      }else{
        var blob=new Blob([text],{type:"application/json"});
        var link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=FILE;
        document.body.appendChild(link);link.click();link.remove();
        msg="Änderung übernommen. Die Datei data.json wurde heruntergeladen. Lade sie in dein GitHub-Repo hoch, damit alle die Änderung sehen.";
      }
      S=st;F=nf;me=findMe(me.name)||me;
      editUser=null;editDish=null;ingEdit=null;if(adminTab==="dishform")adminTab="dishes";
      if(backTo){adminTab=backTo;backTo=null;}
      render();return true;
    }catch(e){toast("Speichern hat nicht geklappt. Bitte versuche es noch einmal.",true);return false;}
    finally{saving=false;}
  }
  async function boot(){
    root.textContent="";
    if(!window.crypto||!crypto.subtle){root.appendChild(el("div",{className:"login wrap"},[el("p",{className:"msg",text:"Dieser Browser kann die Seite nicht entschlüsseln. Öffne sie über https."})]));return;}
    root.appendChild(el("div",{className:"login wrap"},[el("p",{className:"muted",text:"Lade Daten …"})]));
    var sess=null;try{sess=JSON.parse(sessionStorage.getItem("rp_sess")||"null")}catch(e){}
    if(sess&&sess.tok)TOK=sess.tok;
    try{await fetchFile();}
    catch(e){
      root.textContent="";
      root.appendChild(el("div",{className:"login wrap"},[el("p",{className:"msg",role:"alert",text:"Die Daten konnten nicht geladen werden."}),el("div",{className:"row"},[btn("Noch einmal versuchen",boot,"primary")])]));
      return;
    }
    if(sess){
      try{await openState(unb64(sess.dk));KEKraw=unb64(sess.kek);me=findMe(sess.name);}catch(e){me=null;}
      if(!me){S=null;TOK="";try{sessionStorage.removeItem("rp_sess")}catch(e){}}
    }
    render();
  }

  function theme(){var t="light";try{t=(me&&localStorage.getItem("rp_theme_"+me.name))||"light";}catch(e){}return t;}
  function applyTheme(){document.documentElement.setAttribute("data-theme",me?theme():"light");}
  function toggleTheme(){var t=theme()==="dark"?"light":"dark";try{localStorage.setItem("rp_theme_"+me.name,t);}catch(e){}render();}
  var root=document.getElementById("app");
  function render(){
    var keepY=window.scrollY;root.textContent="";applyTheme();
    if(!me){return loginView();}
    if(me.mustChange){return pwView();}
    var tabs=[["start","Start"],["rezepte","Rezepte"],["listen","Listen"]];
    if(me.role==="admin")tabs.push(["admin","Admin"]);
    var nav=el("nav",{className:"tabs"});
    tabs.forEach(function(t){var b=btn(t[1],function(){view=t[0];msg="";render();window.scrollTo(0,0);});b.setAttribute("aria-pressed",view===t[0]);nav.appendChild(b);});
    var top=el("header",{className:"top"},[el("div",{className:"wrap"},[
      el("div",{className:"brand"},[icon(),el("strong",{text:"Kochübersicht Homestate"})]),
      nav,
      el("div",{className:"acts"},[el("span",{className:"who",text:me.name}),
        btn(theme()==="dark"?"Hell":"Dunkel",toggleTheme,"link"),btn("Abmelden",logout,"link")])
    ])]);
    root.appendChild(top);
    var w=el("main",{className:view==="start"?"wrap wide":"wrap"});
    if(view==="start")startView(w);
    else if(view==="rezepte")rezepteView(w);
    else if(view==="listen")listenView(w);
    else if(view==="admin"&&me.role==="admin")adminView(w);
    if(msg)w.appendChild(el("p",{className:"msg",role:"alert",text:msg}));
    w.appendChild(el("div",{style:"height:64px"}));
    root.appendChild(w);
    window.scrollTo(0,keepY);
    [].forEach.call(root.querySelectorAll(".seg"),function(s){var b=s.querySelector('[aria-pressed="true"]');if(b)s.scrollLeft=b.offsetLeft-(s.clientWidth-b.offsetWidth)/2;});
  }

  function loginView(){
    var u=el("input",{autocomplete:"username"}),p=el("input",{type:"password",autocomplete:"current-password"});
    var err=el("p",{className:"msg",role:"alert"});
    var sb=btn("Anmelden",null,"primary");sb.type="submit";
    async function go(){
      if(sb.disabled)return;
      err.textContent="";sb.disabled=true;sb.textContent="Bitte warten …";
      try{
        var fu=fileUser(u.value.trim());
        if(!fu||!fu.wrap)throw 0;
        var kb=await kekBits(p.value,unb64(fu.salt)),k=await aes(kb);
        var raw=await unseal(k,fu.wrap);
        TOK="";if(fu.tok){try{TOK=dec.decode(await unseal(k,fu.tok))}catch(e){}}
        if(TOK&&!SHA){try{await fetchFile()}catch(e){}}
        await openState(raw);
        var f=findMe(fu.name);if(!f)throw 0;
        KEKraw=kb;me=f;keepSession();
        view="start";msg="";render();
      }catch(e){
        S=null;TOK="";sb.disabled=false;sb.textContent="Anmelden";
        err.textContent="Benutzername oder Passwort falsch.";
      }
    }
    var f=el("form",{className:"login wrap"},[
      icon(),el("h2",{text:"Kochübersicht Homestate"}),
      field("Benutzername",u),field("Passwort",p),
      el("div",{className:"row"},[sb]),err
    ]);
    f.onsubmit=function(e){e.preventDefault();go();};
    root.appendChild(f);
  }

  function pwView(){
    var p1=el("input",{type:"password",autocomplete:"new-password"}),p2=el("input",{type:"password",autocomplete:"new-password"});
    var tk=el("input",{type:"password",autocomplete:"off"});
    var err=el("p",{className:"msg",role:"alert"});
    var sb=btn("Passwort speichern",null,"primary");sb.type="submit";
    var askTok=me.role==="admin"&&!TOK;
    var kids=[el("h2",{text:"Neues Passwort festlegen"}),
      el("p",{text:"Du bist mit dem Startpasswort angemeldet. Lege jetzt dein eigenes Passwort fest (mindestens "+MINPW+" Zeichen)."}),
      el("p",{className:"muted",text:"Merke es dir gut: Ohne dieses Passwort kommt niemand mehr an die Daten."}),
      field("Neues Passwort",p1),field("Passwort wiederholen",p2)];
    if(askTok){kids.push(field("GitHub-Schlüssel (optional)",tk));
      kids.push(el("p",{className:"muted",text:"Mit dem Schlüssel speichert die Seite direkt. Du kannst ihn auch später unter Admin → Einstellungen eintragen."}));}
    kids.push(el("div",{className:"row"},[sb,btn("Abmelden",logout)]));kids.push(err);
    var f=el("form",{className:"login wrap"},kids);
    f.onsubmit=async function(e){
      e.preventDefault();
      if(p1.value.length<MINPW){err.textContent="Das Passwort braucht mindestens "+MINPW+" Zeichen.";return;}
      if(p1.value!==p2.value){err.textContent="Die beiden Passwörter stimmen nicht überein.";return;}
      err.textContent="";sb.disabled=true;
      var old=TOK;if(askTok&&tk.value.trim())TOK=tk.value.trim();
      var made=await makeRec(me.name,p1.value,true);
      var name=me.name,users=S.users.map(function(u){return u.name===name?Object.assign({},u,{mustChange:false}):u});
      var ok=await save({users:users},replaceRec(made.rec));
      if(ok){KEKraw=made.kb;keepSession();}else{TOK=old;sb.disabled=false;}
    };
    root.appendChild(f);
  }

  var pick=null,noteEdit=false;
  var EM={herd:"🍳",mixer:"🥤",grill:"🔥"};
  function go(v,extra){view=v;msg="";if(extra)extra();render();window.scrollTo(0,0);}
  function card(title,kids,cls){return el("div",{className:"card"+(cls?" "+cls:"")},[el("h3",{text:title})].concat(kids.filter(Boolean)));}
  function li(label,right){return el("div",{className:"li"},[el("span",{text:label}),right]);}
  function pill(t,c){return el("span",{className:"pill "+c,text:t});}
  function plural(n,one,many){return n+" "+(n===1?one:many);}
  function relDay(ts){var d=Math.floor((Date.now()-ts)/864e5);return d<=0?"heute":d===1?"gestern":"vor "+d+" Tagen";}
  function nextBirthday(b){
    var p=(b||"").split("-");if(p.length!==3)return null;
    var now=new Date(),t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var n=new Date(t.getFullYear(),+p[1]-1,+p[2]);if(n<t)n.setFullYear(t.getFullYear()+1);

      var pname=pn.value.trim(),psize=Math.floor(num(ps.value));
      if(pk.value&&!pname){err.textContent="Bitte gib dem Gebinde einen Namen.";return;}
      if(pk.value&&psize<2){err.textContent="Ein Gebinde muss mindestens 2 Stück enthalten.";return;}
      var rec={name:name,weight:num(wt.value),shop:sh.value,usd:num(us.value),mxn:num(mx.value),stock:ex?(ex.stock||0):0};
      if(pk.value)rec.pack={name:pname,size:psize,usd:num(pu.value),mxn:num(pm.value),only:pk.value==="only",shop:psh.value};
      var ings=ex?S.ingredients.map(function(m){return m===ex?rec:m}):S.ingredients.concat([rec]);
      var ds=S.dishes;
      if(ex&&ex.name!==name)ds=S.dishes.map(function(d){
        return Object.assign({},d,{ingredients:d.ingredients.map(function(i){return i.name===ex.name?{name:name,qty:i.qty}:i})});
      });
      save({ingredients:ings,dishes:ds});
    },"primary")]);
    if(ex)row.appendChild(btn("Abbrechen",function(){ingEdit=null;if(backTo){adminTab=backTo;backTo=null;}render();}));
    w.appendChild(el("div",{className:"card"},[el("h3",{text:ex?"Zutat bearbeiten":"Neue Zutat"}),
      field("Name der Zutat",nm),field("Gewicht pro Stück (kg)",wt),field("Shop",sh),
      field("Gebinde (Flasche, Sack, Glas o. Ä.)",pk),usF,
      el("div",{className:"row"},[el("label",{className:"chk"},[pe,"Auch in Pesos (₽) erhältlich"])]),mxF,
      pbox,row,err]));

    var listErr=el("p",{className:"msg",role:"alert"});
    var box=el("div");
    function fill(){
      box.textContent="";listErr.textContent="";
      var all=S.ingredients.slice().sort(function(a,b){return a.name.localeCompare(b.name,"de")});
      var t=(searchTerm.ing||"").trim().toLowerCase();
      var ms=all.filter(function(m){return !t||m.name.toLowerCase().indexOf(t)>-1||(m.shop||"").toLowerCase().indexOf(t)>-1});
      if(!all.length)box.appendChild(el("p",{className:"muted",text:"Noch keine Zutaten angelegt."}));
      else if(!ms.length)box.appendChild(el("p",{className:"muted",text:"Keine Zutat gefunden."}));
      ms.forEach(function(m){
        var used=S.dishes.filter(function(d){return d.ingredients.some(function(i){return i.name===m.name})});
        box.appendChild(el("div",{className:"card"},[el("h3",{text:m.name}),
          el("p",{className:"muted",text:(m.shop||"Kein Shop")+" · "+(m.weight>0?kg(m.weight):"kein Gewicht")+" · "+priceText(m)}),
          el("div",{className:"row"},[btn("Bearbeiten",function(){ingEdit=m.name;render();window.scrollTo(0,0);}),
            btn("Löschen",function(){
              if(used.length){listErr.textContent="„"+m.name+"“ wird noch in Gerichten verwendet: "+used.map(function(d){return d.name}).join(", ")+".";return;}
              if(!confirm("Zutat „"+m.name+"“ löschen?"))return;
              save({ingredients:S.ingredients.filter(function(x){return x!==m})});
            },"danger")])]));
      });
    }
    w.appendChild(el("h2",{text:"Alle Zutaten",style:"margin-top:28px"}));
    if(S.ingredients.length)w.appendChild(searchBox("ing",fill));
    w.appendChild(listErr);w.appendChild(box);fill();
  }

  boot();
})();
</script>
